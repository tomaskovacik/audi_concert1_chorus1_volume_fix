name: Release Firmware

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Install official STM32 core
        run: |
          arduino-cli core update-index \
            --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core install STMicroelectronics:stm32 \
            --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json

      - name: Install FlexWire library
        run: arduino-cli lib install FlexWire

      - name: Build firmware
        run: |
          arduino-cli compile \
            --fqbn "STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C6,opt=osstd" \
            --output-dir build/ \
            SW/audi_volume_fix_stm32

      - name: Rename binary
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp build/audi_volume_fix_stm32.ino.bin \
             build/audi_volume_fix_stm32_HWv5_${VERSION}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/audi_volume_fix_stm32_HWv5_*.bin
          generate_release_notes: true
